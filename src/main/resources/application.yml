spring:
  application:
    name: financas-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financas}
    username: ${DB_USER:financas}
    password: ${DB_PASSWORD:financas}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    # Em produção, defina JWT_SECRET com pelo menos 32 caracteres.
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-0123456789}
    expiration: ${JWT_EXPIRATION:2h}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    operations-sorter: method
